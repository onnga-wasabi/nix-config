# key maps
set-option -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

set -g prefix C-q
set -sg escape-time 1
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ',xterm*:Tc'
set-option -g allow-passthrough on

setw -g mode-keys vi

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v split-window -h
bind s split-window -v
bind -r C-q choose-tree -F \#W

bind r source-file ${XDG_CONFIG_HOME}/tmux/tmux.conf \; display "Reloaded!"

# Claude Code をフローティングポップアップで起動（prefix + a）
bind a display-popup -E -w 90% -h 90% "claude"
# 直前のセッションを再開（prefix + A）
bind A display-popup -E -w 90% -h 90% "claude --continue"

set-option -g status on
set-option -g status-interval 1
set-option -g status-justify 'left'
set-option -g history-limit 100000

# theming
source-file ${XDG_CONFIG_HOME}/tmux/iceberg.tmux.conf

# Plugins（sensible・yank・resurrect・continuum。tmux/default.nix で nix から供給）
# auto restore tmux（プラグインを読み込む前に設定しておく）
set -g @continuum-restore 'on'
source-file ${XDG_CONFIG_HOME}/tmux/plugins.tmux.conf
