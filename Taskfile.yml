version: '3'

tasks:
  stage:
    desc: 'stage'
    cmds:
      # flake は git が追跡していないファイルを見ないので、新規ファイルを追跡対象に入れる。
      # -N（intent-to-add）なので中身はステージに乗らず、コミットされる内容は変わらない。
      - git add -N .
    silent: false
  format:
    desc: 'format'
    cmds:
      # --inputs-from . で nixpkgs をレジストリではなく flake.lock の版に解決させる
      - nix --extra-experimental-features "nix-command flakes" shell --inputs-from . nixpkgs#nixpkgs-fmt -c nixpkgs-fmt  .
      - nix --extra-experimental-features "nix-command flakes" shell --inputs-from . nixpkgs#stylua -c stylua  .
    silent: false
  build:
    desc: 'build'
    vars:
      PLATFORM:
        sh: uname -s
    cmds:
      # deps だと並列に走るので、format → stage → build の順に呼ぶ
      - task: format
      - task: stage
      - nix --extra-experimental-features "nix-command flakes" build --max-jobs 4 ".#darwinConfigurations.{{.PLATFORM}}.system"
    silent: false
  apply:
    desc: 'apply'
    deps:
      - build
    vars:
      PLATFORM:
        sh: uname -s
    cmds:
      - sudo ./result/sw/bin/darwin-rebuild switch --flake ".#{{.PLATFORM}}"
    silent: false
